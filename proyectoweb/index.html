<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un regalo para ti 🌹</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffd6e0, #fff0f5);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* =========================
           PANTALLA DE INICIO
        ========================== */

        #inicio {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        #inicio h1 {
            color: #b2224b;
            font-size: 45px;
            margin-bottom: 15px;
        }

        #inicio p {
            color: #7b3045;
            font-size: 22px;
            margin-bottom: 35px;
        }

        #boton {
            border: none;
            padding: 18px 40px;

            background: #d6335c;
            color: white;

            font-size: 20px;
            font-weight: bold;

            border-radius: 30px;

            cursor: pointer;

            box-shadow: 0 5px 15px rgba(0,0,0,0.2);

            transition: 0.3s;
        }

        #boton:hover {
            transform: scale(1.1);
            background: #b91f48;
        }


        /* =========================
           RAMO
        ========================== */

        #ramo {
            display: none;

            position: relative;

            width: 600px;
            height: 700px;

            margin: auto;
        }


        /* =========================
           TALLOS
        ========================== */

        .tallo {
            position: absolute;

            width: 10px;
            height: 330px;

            background: #27833a;

            bottom: 160px;
            left: 295px;

            border-radius: 20px;

            transform-origin: bottom;

            z-index: 1;
        }

        .tallo1 {
            transform: rotate(-25deg);
        }

        .tallo2 {
            transform: rotate(-12deg);
        }

        .tallo3 {
            transform: rotate(0deg);
        }

        .tallo4 {
            transform: rotate(12deg);
        }

        .tallo5 {
            transform: rotate(25deg);
        }


        /* =========================
           HOJAS
        ========================== */

        .hoja {
            position: absolute;

            width: 100px;
            height: 45px;

            background: #3cae4d;

            border-radius: 100% 0;

            z-index: 2;
        }

        .hoja1 {
            left: 145px;
            bottom: 280px;
            transform: rotate(-25deg);
        }

        .hoja2 {
            left: 350px;
            bottom: 300px;
            transform: rotate(115deg);
        }

        .hoja3 {
            left: 180px;
            bottom: 220px;
            transform: rotate(30deg);
        }

        .hoja4 {
            left: 345px;
            bottom: 220px;
            transform: rotate(145deg);
        }


        /* =========================
           ROSAS
        ========================== */

        .rosa {
            position: absolute;

            width: 150px;
            height: 150px;

            z-index: 5;
        }

        .rosa1 {
            left: 80px;
            top: 120px;
            transform: scale(.85);
        }

        .rosa2 {
            left: 205px;
            top: 55px;
        }

        .rosa3 {
            left: 330px;
            top: 120px;
            transform: scale(.9);
        }

        .rosa4 {
            left: 135px;
            top: 215px;
            transform: scale(.75);
        }

        .rosa5 {
            left: 285px;
            top: 220px;
            transform: scale(.8);
        }


        /* =========================
           PÉTALOS DE LAS ROSAS
        ========================== */

        .petalo {
            position: absolute;

            width: 70px;
            height: 70px;

            background: #e6395f;

            border-radius: 50%;

            left: 40px;
            top: 40px;

            box-shadow:
                0 0 0 8px #c9234b,
                inset 0 0 15px #8f1737;
        }

        .petalo1 {
            transform: translate(-25px, -10px);
        }

        .petalo2 {
            transform: translate(25px, -10px);
        }

        .petalo3 {
            transform: translate(-20px, 25px);
        }

        .petalo4 {
            transform: translate(20px, 25px);
        }

        .petalo5 {
            width: 55px;
            height: 55px;

            left: 48px;
            top: 48px;

            background: #ff5575;

            box-shadow: none;
        }


        /* =========================
           ENVOLTURA
        ========================== */

        .envoltura {
            position: absolute;

            width: 370px;
            height: 250px;

            left: 115px;
            bottom: 40px;

            background: #f2b6c6;

            clip-path: polygon(
                8% 0,
                92% 0,
                70% 100%,
                30% 100%
            );

            z-index: 10;
        }

        .envoltura2 {
            position: absolute;

            width: 340px;
            height: 220px;

            left: 130px;
            bottom: 55px;

            background: #fff4f7;

            clip-path: polygon(
                12% 0,
                88% 0,
                68% 100%,
                32% 100%
            );

            z-index: 11;
        }


        /* =========================
           MOÑO
        ========================== */

        .mono {
            position: absolute;

            left: 255px;
            bottom: 175px;

            z-index: 20;
        }

        .lazo {
            position: absolute;

            width: 75px;
            height: 55px;

            background: #c9234b;

            border-radius: 50%;
        }

        .izquierda {
            right: 5px;
            transform: rotate(25deg);
        }

        .derecha {
            left: 5px;
            transform: scaleX(-1) rotate(25deg);
        }

        .nudo {
            position: absolute;

            width: 35px;
            height: 35px;

            background: #9e193b;

            border-radius: 50%;

            left: 20px;
            top: 10px;
        }


        /* =========================
           MENSAJE
        ========================== */

        .mensaje {
            position: absolute;

            bottom: 5px;

            width: 100%;

            text-align: center;

            color: #a32146;

            font-size: 28px;

            font-weight: bold;
        }


        /* =========================
           CORAZONES
        ========================== */

        .corazon {
            position: absolute;

            color: #e6395f;

            font-size: 30px;

            animation: flotar 4s infinite ease-in-out;
        }

        .c1 {
            left: 30px;
            top: 100px;
        }

        .c2 {
            right: 40px;
            top: 180px;
            animation-delay: 1s;
        }

        .c3 {
            left: 70px;
            bottom: 100px;
            animation-delay: 2s;
        }

        .c4 {
            right: 80px;
            bottom: 130px;
            animation-delay: 1.5s;
        }

        @keyframes flotar {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

            100% {
                transform: translateY(0);
            }

        }

    </style>
</head>


<body>


    <!-- ==================================
         PANTALLA INICIAL
    =================================== -->

    <div id="inicio">

        <h1>🌹 Tengo algo para ti 🌹</h1>

        <p>
            Hay un pequeño detalle que preparé especialmente para ti...
        </p>

        <button id="boton" onclick="mostrarRamo()">
            💝 Presiona aquí 💝
        </button>

    </div>


    <!-- ==================================
         RAMO
    =================================== -->

    <div id="ramo">

        <!-- Corazones -->

        <div class="corazon c1">❤️</div>
        <div class="corazon c2">💕</div>
        <div class="corazon c3">❤️</div>
        <div class="corazon c4">💗</div>


        <!-- TALLOS -->

        <div class="tallo tallo1"></div>
        <div class="tallo tallo2"></div>
        <div class="tallo tallo3"></div>
        <div class="tallo tallo4"></div>
        <div class="tallo tallo5"></div>


        <!-- HOJAS -->

        <div class="hoja hoja1"></div>
        <div class="hoja hoja2"></div>
        <div class="hoja hoja3"></div>
        <div class="hoja hoja4"></div>


        <!-- =====================
             ROSA 1
        ====================== -->

        <div class="rosa rosa1">

            <div class="petalo petalo1"></div>
            <div class="petalo petalo2"></div>
            <div class="petalo petalo3"></div>
            <div class="petalo petalo4"></div>
            <div class="petalo petalo5"></div>

        </div>


        <!-- ROSA 2 -->

        <div class="rosa rosa2">

            <div class="petalo petalo1"></div>
            <div class="petalo petalo2"></div>
            <div class="petalo petalo3"></div>
            <div class="petalo petalo4"></div>
            <div class="petalo petalo5"></div>

        </div>


        <!-- ROSA 3 -->

        <div class="rosa rosa3">

            <div class="petalo petalo1"></div>
            <div class="petalo petalo2"></div>
            <div class="petalo petalo3"></div>
            <div class="petalo petalo4"></div>
            <div class="petalo petalo5"></div>

        </div>


        <!-- ROSA 4 -->

        <div class="rosa rosa4">

            <div class="petalo petalo1"></div>
            <div class="petalo petalo2"></div>
            <div class="petalo petalo3"></div>
            <div class="petalo petalo4"></div>
            <div class="petalo petalo5"></div>

        </div>


        <!-- ROSA 5 -->

        <div class="rosa rosa5">

            <div class="petalo petalo1"></div>
            <div class="petalo petalo2"></div>
            <div class="petalo petalo3"></div>
            <div class="petalo petalo4"></div>
            <div class="petalo petalo5"></div>

        </div>


        <!-- ENVOLTURA -->

        <div class="envoltura"></div>
        <div class="envoltura2"></div>


        <!-- MOÑO -->

        <div class="mono">

            <div class="lazo izquierda"></div>
            <div class="lazo derecha"></div>

            <div class="nudo"></div>

        </div>


        <!-- MENSAJE -->

        <div class="mensaje">
            🌹 Para alguien muy especial 🌹
        </div>

    </div>


    <!-- ==================================
         JAVASCRIPT
    =================================== -->

    <script>

        function mostrarRamo() {

            // Ocultar pantalla inicial
            document.getElementById("inicio").style.display = "none";

            // Mostrar ramo
            document.getElementById("ramo").style.display = "block";

        }

    </script>

</body>
</html>
